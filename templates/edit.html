<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edit Student</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#4facfe,#00f2fe);
}

.container{
    width:400px;
    background:white;
    padding:35px;
    border-radius:15px;
    box-shadow:0 10px 25px rgba(0,0,0,0.2);
}

h1{
    text-align:center;
    color:#2c3e50;
    margin-bottom:10px;
}

p{
    text-align:center;
    color:gray;
    margin-bottom:25px;
}

label{
    display:block;
    margin-bottom:8px;
    font-weight:bold;
    color:#333;
}

input{
    width:100%;
    padding:12px;
    margin-bottom:20px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:15px;
    transition:0.3s;
}

input:focus{
    outline:none;
    border-color:#4facfe;
    box-shadow:0 0 8px rgba(79,172,254,0.4);
}

button{
    width:100%;
    padding:12px;
    background:#4facfe;
    color:white;
    border:none;
    border-radius:8px;
    font-size:16px;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    background:#2d8cf0;
}

.back{
    display:block;
    text-align:center;
    margin-top:20px;
    text-decoration:none;
    color:#4facfe;
    font-weight:bold;
}

.back:hover{
    color:#2d8cf0;
}

</style>

</head>
<body>

<div class="container">

<h1>✏️ Edit Student</h1>
<p>Update the student details below.</p>

<form action="/update/{{ student.id }}" method="post">

    <label>Name</label>
    <input
        type="text"
        name="name"
        value="{{ student.name }}"
        required
    >

    <label>Course</label>
    <input
        type="text"
        name="course"
        value="{{ student.course }}"
        required
    >

    <button type="submit">
        Update Student
    </button>

</form>

<a href="/dashboard" class="back">← Back to Dashboard</a>

</div>

</body>
</html>
