<!DOCTYPE html>
<html>
<head>
    <title>Edit Student</title>
</head>
<body>

<h1>Edit Student</h1>

<form action="/update/{{ student.id }}" method="post">

    <label>Name</label><br>
    <input type="text" name="name" value="{{ student.name }}"><br><br>

    <label>Course</label><br>
    <input type="text" name="course" value="{{ student.course }}"><br><br>

    <button type="submit">
        Update Student
    </button>

</form>

</body>
</html>
